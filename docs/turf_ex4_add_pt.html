<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <style>
        body {
            margin: 0;
        }

        #map {
            height: 90vh;
        }

        #controls {
            padding: 8px;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <div id="controls">
        Buffer radius: <input type="range" id="radius" min="10" max="500" value="100">
        <span id="radiusLabel">100</span> km (click the map to add a point)
    </div>
    <div id="map"></div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://demotiles.maplibre.org/style.json',
            center: [-106, 35],
            zoom: 4
        });

        const points = [];

        document.getElementById('radius').addEventListener('input', e => {
            document.getElementById('radiusLabel').textContent = e.target.value;
        });

        map.on('load', () => {
            map.addSource('points', { type: 'geojson', data: turf.featureCollection([]) });
            map.addSource('buffers', { type: 'geojson', data: turf.featureCollection([]) });

            map.addLayer({
                id: 'buffers', type: 'fill', source: 'buffers',
                paint: { 'fill-color': '#2a7de1', 'fill-opacity': 0.3 }
            });
            map.addLayer({
                id: 'points', type: 'circle', source: 'points',
                paint: { 'circle-radius': 5, 'circle-color': '#c0392b' }
            });

            map.on('click', e => {
                const radius = Number(document.getElementById('radius').value);
                points.push(turf.point([e.lngLat.lng, e.lngLat.lat], { radius }));

                // variable buffer: each feature uses its own radius property
                const buffers = points.map(p =>
                    turf.buffer(p, p.properties.radius, { units: 'kilometers' }));

                map.getSource('points').setData(turf.featureCollection(points));
                map.getSource('buffers').setData(turf.featureCollection(buffers));
            });
        });
    </script>
</body>

</html>
