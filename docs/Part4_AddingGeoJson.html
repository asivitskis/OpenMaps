<!DOCTYPE html>
<html>
<head>
    <title>My Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.css" />
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
        .maplibregl-popup-content {
            font-family: sans-serif;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.mjs';

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron', // change this to your preferred map style
            center: [0, 20],   // [lng, lat] -- note the order, opposite of Leaflet's [lat, lng]
            zoom: 2,
            pitch: 0,
            bearing: 0
        });
        window.map = map;   // exposes map to the browser console for debugging

        const data = "https://github.com/opengeos/datasets/releases/download/vector/cables.geojson";
        const color = "#a11998";
        const hoverColor = "#000000";

        map.on('load', () => {
            map.addSource('cables', {
                type: 'geojson',
                data: data,
                generateId: true // needed so we can use feature-state for hover
            });

            map.addLayer({
                id: 'cables-line',
                type: 'line',
                source: 'cables',
                paint: {
                    'line-color': [
                        'case',
                        ['boolean', ['feature-state', 'hover'], false],
                        hoverColor,
                        color
                    ],
                    'line-width': [
                        'case',
                        ['boolean', ['feature-state', 'hover'], false],
                        3,
                        1
                    ],
                    'line-opacity': 1
                }
            });
        });
    </script>
</body>
</html>
