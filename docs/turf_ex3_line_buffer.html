<!DOCTYPE html>
<html lang="en">

<head>
    <title>Buffer a GeoJSON</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css" />
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs';

        const data = {
            "type": "FeatureCollection",
            "features": [
                {
                    "type": "Feature",
                    "properties": {},
                    "geometry": {
                        "type": "LineString",
                        "coordinates": [
                            [-108.120241, 32.709764],
                            [-108.118965, 32.70749],
                            [-108.117087, 32.704458],
                            [-108.116561, 32.703005],
                            [-108.11536, 32.699582],
                            [-108.115285, 32.698319],
                            [-108.113709, 32.692636],
                            [-108.113334, 32.692194],
                            [-108.112808, 32.690867],
                            [-108.112358, 32.689477],
                            [-108.111682, 32.688909],
                            [-108.111307, 32.687772],
                            [-108.111307, 32.686445],
                            [-108.111007, 32.684423],
                            [-108.110707, 32.683412]
                        ]
                    }
                },
            ]
        }

        // Buffer only the stream (the LineString), 500 m on each side
        const stream = data.features.find(f => f.geometry.type === 'LineString');
        const buffered = turf.buffer(stream, 500, { units: 'meters' });

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/bright',
            bounds: turf.bbox(buffered),
            fitBoundsOptions: { padding: 40 }
        });

        map.on('load', () => {
            map.addSource('buffer', { type: 'geojson', data: buffered });
            map.addSource('data', { type: 'geojson', data });
            map.addLayer({
                id: 'buffer', type: 'fill', source: 'buffer',
                paint: { 'fill-color': '#d62828', 'fill-opacity': 0.2 }
            });
            map.addLayer({
                id: 'stream', type: 'line', source: 'data', filter: ['==', '$type', 'LineString'],
                paint: { 'line-color': '#003049', 'line-width': 2.5 }
            });
        });
    </script>
</body>

</html>
